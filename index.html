.siab-burger{ display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:8px; margin-left:auto; }
.siab-burger span{ width:24px; height:2px; background:#16181D; display:block; transition:.2s; }
.siab-burger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.siab-burger.open span:nth-child(2){ opacity:0; }
.siab-burger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
.siab-mobile-menu{ display:none; position:absolute; top:100%; left:0; right:0; background:#fff; border-bottom:1px solid #E3E5E8; box-shadow:0 12px 24px rgba(0,0,0,.1); flex-direction:column; padding:6px 0; z-index:60; }
.siab-mobile-menu.open{ display:flex; }
.siab-mobile-menu a{ padding:14px 24px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:15px; color:#16181D; border-bottom:1px solid #F0F1F3; text-decoration:none; }

<body>
  <div class="wrap">

    <a href="SIAB-Inicio.dc.html">Entrar &rarr;</a>
  </div>
<script id="siab-burger-js">
(function(){
  function init(){
    var anchors=document.querySelectorAll('a.navlink');
    var headers=[];
    anchors.forEach(function(a){
      var el=a;
      while(el && el!==document.body){
        if(getComputedStyle(el).position==='sticky'){ if(headers.indexOf(el)<0) headers.push(el); break; }
        el=el.parentElement;
      }
    });
    headers.forEach(function(header){
      if(header.querySelector('.siab-burger')) return;
      var links=[].slice.call(header.querySelectorAll('a.navlink, a.btnr'));
      if(!links.length) return;
      var group=links[0].parentElement;
      if(group && group!==header) group.classList.add('siab-nav-hidden');
      var btn=document.createElement('button');
      btn.className='siab-burger'; btn.setAttribute('aria-label','Menú');
      btn.innerHTML='<span></span><span></span><span></span>';
      var panel=document.createElement('div'); panel.className='siab-mobile-menu';
      links.forEach(function(l){
        var a=document.createElement('a');
        a.href=l.getAttribute('href')||'#';
        a.textContent=(l.textContent||'').trim();
        panel.appendChild(a);
      });
      btn.addEventListener('click',function(){ panel.classList.toggle('open'); btn.classList.toggle('open'); });
      panel.addEventListener('click',function(e){ if(e.target.tagName==='A'){ panel.classList.remove('open'); btn.classList.remove('open'); } });
      var inner=header.firstElementChild||header;
      inner.appendChild(btn);
      header.appendChild(panel);
    });
  }
  if(document.readyState!=='loading') setTimeout(init,120); else document.addEventListener('DOMContentLoaded',function(){setTimeout(init,120);});
})();
</script>
